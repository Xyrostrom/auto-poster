name: auto-post

on:
  schedule:
    # 05:07 UTC = 10:37 IST daily. Off :00 because the top of the hour is the
    # busiest slot on shared runners and scheduled jobs get delayed or dropped.
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma separated: youtube,instagram"
        default: "youtube,instagram"
        required: false
      dry_run:
        description: "Pick + caption only, upload nothing"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would race on state/posted.json and double-post.
  group: auto-post
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state file

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the write-scoped GITHUB_TOKEN in .git/config while pip
          # packages and our scripts run; only the commit step gets it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish
        # Leave time inside the 45-minute job for the sweep and state commit.
        timeout-minutes: 35
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          CONTENT_CONTEXT: ${{ vars.CONTENT_CONTEXT }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          # NOT `GH_TOKEN`: that name is auto-read by the GitHub CLI and many
          # actions, which would silently hand this PAT to any tool that shells
          # out to `gh`.
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
          # Inputs go through env, never interpolated into the shell below --
          # `${{ }}` inside `run:` is a script-injection sink.
          # vars.PLATFORMS lets scheduled runs skip a platform that isn't set up yet.
          PLATFORMS: ${{ inputs.platforms || vars.PLATFORMS || 'youtube,instagram' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--platforms "$PLATFORMS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python scripts/publish.py "${args[@]}"

      # __exit__ in stage_public.py covers the happy path, but it never runs if
      # the job is cancelled or the runner dies mid-upload -- which would leave
      # the video publicly downloadable on the staging repo indefinitely.
      - name: Sweep staged media
        if: always()
        env:
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: python scripts/stage_public.py --sweep

      - name: Commit updated state
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore: record post run [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Another run (or you) may have pushed in the meantime; losing this
          # commit would re-post the same video tomorrow, so retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push state/posted.json after 3 attempts"
          exit 1
