name: auto-post

on:
  schedule:
    # Runs every hour; the "Gate" step below only lets Publish proceed
    # during the hour set by the POST_HOUR_UTC repo variable (default 5 UTC
    # = 10:30 IST). Change POST_HOUR_UTC from the dashboard, no YAML edit
    # needed.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma separated: youtube,instagram"
        default: "youtube,instagram"
        required: false
      dry_run:
        description: "Pick + caption only, upload nothing"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would race on state/posted.json and double-post.
  group: auto-post
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state file

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Gate on configured post hour
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want="${{ vars.POST_HOUR_UTC || '5' }}"
          now="$(date -u +%-H)"
          if [ "$now" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          CONTENT_CONTEXT: ${{ vars.CONTENT_CONTEXT }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          # NOT `GH_TOKEN`: that name is auto-read by the GitHub CLI and many
          # actions, which would silently hand this PAT to any tool that shells
          # out to `gh`.
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
          # Inputs go through env, never interpolated into the shell below --
          # `${{ }}` inside `run:` is a script-injection sink.
          PLATFORMS: ${{ inputs.platforms || vars.PLATFORMS || 'youtube,instagram' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--platforms "$PLATFORMS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python scripts/publish.py "${args[@]}"

      # __exit__ in stage_public.py covers the happy path, but it never runs if
      # the job is cancelled or the runner dies mid-upload -- which would leave
      # the video publicly downloadable on the staging repo indefinitely.
      - name: Sweep staged media
        if: always()
        env:
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: python scripts/stage_public.py --sweep

      - name: Commit updated state
        if: always()
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore: record post run [skip ci]"
          # Another run may have pushed in the meantime.
          git pull --rebase --autostash
          git push
